{% extends "_base.html" %}

{% block content %}
<div class="container">
    <h2 class="mt-5">{{ view.object.pk|yesno:"Edit Exam,Add New Exam" }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'exam-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
