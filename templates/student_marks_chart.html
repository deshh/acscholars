{% extends "_base.html" %}

{% block content %}
<div class="container">

    <!-- Subject selection form -->

        {{ form.subject }}
        <button type="submit" class="btn btn-primary">Submit</button>
    </form> -->

    <!-- Display the chart if available -->
    {% if graph_div %}
    <div>
        {{ graph_div|safe }}
    </div>
